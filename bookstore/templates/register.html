{% extends 'base.html' %}
{% block title %}Create account · Team 1 Bookstore{% endblock %}
{% block content %}<section class="card form-card p-4 mx-auto">
<h1 class="h2">Create your account</h1><p class="text-secondary">Join as a Customer. It only takes a moment.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% include '_account_fields.html' %}<button class="btn btn-primary w-100">Create account</button></form>
<p class="mt-3 mb-0">Already a member? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</section>{% endblock %}
