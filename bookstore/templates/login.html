{% extends 'base.html' %}
{% block title %}Sign in · Team 1 Bookstore{% endblock %}
{% block content %}<section class="card form-card p-4 mx-auto">
<h1 class="h2">Welcome back</h1><p class="text-secondary">Sign in to your bookstore account.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label for="email" class="form-label">Email</label><input class="form-control" type="email" id="email" name="email" required maxlength="254" autocomplete="username" value="{{ request.form.get('email', '') }}"></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input class="form-control" type="password" id="password" name="password" required minlength="12" maxlength="128" autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Sign in</button>
</form><p class="mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create account</a></p>
</section>{% endblock %}
