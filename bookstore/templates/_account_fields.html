<div class="mb-3"><label for="name" class="form-label">Full name</label><input class="form-control" id="name" name="name" value="{{ request.form.get('name', '') }}" required minlength="2" maxlength="80" autocomplete="name"></div>
<div class="mb-3"><label for="email" class="form-label">Email</label><input class="form-control" id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required maxlength="254" autocomplete="email"></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input class="form-control" id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="password-help"><div id="password-help" class="form-text">Use 12 to 128 characters. A long, unique phrase is a good choice.</div></div>
<div class="mb-3"><label for="confirm_password" class="form-label">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></div>
